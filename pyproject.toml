[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qfbench2-track-forecasting"
version = "2.1.0"
description = """\
QFBench 2.0 Track-2 canonical scorer. Exposes qfbench2_track_forecasting.scoring.build_verifier(ctx) \
for the shared smoke runner and qfbench2_track_forecasting.official.score_roster(...) as the ONE \
official entrypoint the private final scorer and the CodaBench scoring image both consume. All \
scoring math lives in qfbench2-common."""
requires-python = ">=3.13"

# `jsonschema` is a PRODUCTION dependency, not an extra. Gate g1 raises an organizer fault when it
# is absent rather than skipping validation: before the freeze `except ModuleNotFoundError: pass`
# meant a host without it accepted a garbage sidecar, and because the 200-draw floor lived only in
# the schema, that one `pass` removed the floor. A validator that is optional is a validator that
# is sometimes not there.
dependencies = [
  "numpy>=2.1",
  "pandas>=2.2",
  "pyarrow>=18",
  "jsonschema>=4.21",
  # A MINIMUM, not a URL. `agenthon2026-runner/scoring-image/build.sh` stages the toolkit from a
  # local checkout, and its builder has no git and no credentials, so `check_no_git_dep` refuses
  # any `@ git+` dependency in every profile. The git-URL form this line carried from 2026-08-29
  # to 2026-09-02 therefore refused every scoring-image build, development profile included,
  # while Track 1 and Track 4 already declared a floor. Every install path this repository
  # documents installs the toolkit FIRST, by URL and tag (README "Running the scorer locally" and
  # "Install", Dockerfile, .github/workflows/ci.yml), and this floor is then satisfied by it.
  #
  # The URL's own argument still stands and is not answered here: `qfbench2-common` is
  # UNREGISTERED on PyPI (404), so a bare name is a dependency-confusion surface, and a cold
  # `pip install .` with nothing installed cannot resolve it from any index -- install the
  # toolkit first, as documented. ">=2.3.1" because v2.3.1 is the first toolkit release that
  # carries `qfbench2_common.contracts`, which `qfbench2_track_forecasting.scoring` imports at
  # module scope; "<3" because this toolkit ships real content across minor versions and no 3.x
  # has been seen.
  "qfbench2-common>=2.3.1,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["ruff==0.4.7", "mypy==1.19.1"]

[tool.setuptools]
packages = ["qfbench2_track_forecasting"]

[project.scripts]
# The submission verb. The harness invokes `forecast ...` on PATH.
forecast = "qfbench2_track_forecasting.cli:main"
# The unranked local scorer. Named distinctly from `forecast` so nobody mistakes it for the
# official path: it grades against card.toml with no reference scale, so its composite is raw.
qfbench2-t2-score = "qfbench2_track_forecasting.scoring:_main"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The shim re-exports dynamically on purpose; see its docstring.
"scoring/scoring.py" = ["F403", "F405", "E402"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: needs Docker, a registry, a network or a sibling service; skipped in unit runs",
]
